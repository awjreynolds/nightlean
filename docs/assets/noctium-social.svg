    <text x="60" y="181" fill="#AEBFD5" font-size="20">Author-written specifications. Lean-checked proofs. A direct native backend.</text>
    <text x="60" y="218" fill="#8BAFFF" font-size="14" font-weight="700" letter-spacing="1.8">PROJECT GOALS</text>
    <text x="1140" y="218" fill="#AEBFD5" font-size="15" text-anchor="end">Full target scope · Selected programs qualified today</text>

