<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Noctium: contract proofs and the full native Midnight capability goal</title>
  <desc id="description">Research preview. Project goals include every instruction and value type in native ZKIR v3, Midnight ledger state, cryptography, composition, events and assets, a Lean contract language with generics, bounded control, private state and guarded disclosure, and Rust, C/C++, TypeScript/WASM, Kotlin and Swift host SDKs. Published evidence covers claim-specific proofs, exact artifacts, native localnet runs and a Rust/C++ runtime subset. The selected claim has qualified deployed identity. Generic scalar lowerer soundness and completeness are proved. Frontend, broader native preservation and capability coverage remain open. These goals are not a claim of full delivered coverage.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101D30"/>
      <stop offset="1" stop-color="#080F1C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70E6CF"/>
      <stop offset="1" stop-color="#8BAFFF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <path d="M0 2H1200" stroke="url(#accent)" stroke-width="4"/>

  <g stroke="#70E6CF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M62 96V48L98 96V48"/>
