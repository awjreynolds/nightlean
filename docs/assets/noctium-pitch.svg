    <linearGradient id="foil" x1=".1" y1=".2" x2=".95" y2=".9"><stop stop-color="#9af5dd"/><stop offset=".52" stop-color="#79cbef"/><stop offset="1" stop-color="#b6acff"/></linearGradient>
    <linearGradient id="glass" x2=".9" y2="1"><stop stop-color="#254652"/><stop offset="1" stop-color="#172538"/></linearGradient>
    <pattern id="dots" width="19" height="19" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#738fb6" opacity=".33"/></pattern>
    <g id="wafer"><path d="M0 60 174 0 348 60 174 120Z"/></g>
    <g id="mark" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 42V2l32 40V2" stroke-width="3.5"/><path d="M0 22h9m32 0h9" stroke-width="2"/><circle cx="9" cy="2" r="3" stroke-width="2" fill="#111e31"/><circle cx="41" cy="42" r="3" stroke-width="2" fill="#111e31"/></g>
  </defs>
