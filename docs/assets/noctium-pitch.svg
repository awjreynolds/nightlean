    <text x="253" y="817" fill="#e1eaf5" font-size="23">Full ZKIR v3 · Composition · Web/mobile SDKs: TypeScript/WASM, Kotlin, Swift</text>
    <text x="77" y="863" fill="#a7b9ce" font-size="18">Proof audits cover selected contracts at recorded revisions. No Compact compiler or runtime dependency.</text>
    <text x="1524" y="863" text-anchor="end" fill="#b9cddd" font-size="18" font-weight="600">github.com/awjreynolds/noctium</text>
  </g>
