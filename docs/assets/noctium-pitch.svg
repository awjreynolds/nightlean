<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Noctium | Prove contract behavior. Compile for Midnight.</title>
  <desc id="desc">Noctium is a Lean 4 compiler and proof framework for Midnight. Authors specify and prove source properties in Lean. Its typed compiler emits ZKIR v3 circuits and Impact ledger plans directly. Tuples and vectors support checked structural widening while records and enums retain nominal identity. Checked composite entrypoint returns reconstruct into typed SDK results. Private Native call arguments bind through the native ABI and communication commitment. Native call claims assemble into checked intents with verified proofs. A funded two-contract call finalized on localnet with both states verified. The Rust host uses Midnight libraries. Current scope includes 39 of 47 registered native operations and scoped support across 15 native type families. A historical 16-entrypoint token recorded 17 accepted localnet calls. Full ZKIR v3, contract composition and web and mobile SDKs are goals. Proof audits cover selected contracts and recorded revisions.</desc>
