name: POC compiler checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean compiler and contract examples
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check project branding
        run: python3 scripts/check-branding.py
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Build the POC compiler
        run: lake build noctium Noctium.Compiler
      - name: Check source contract examples
        run: |
          lake env lean examples/PrivateClaim.lean
          lake env lean examples/BoundedScalars.lean
          lake env lean examples/Disclosure.lean
          lake env lean examples/NoctiumPrivateClaim.lean
          lake env lean examples/PrivateStateCounter.lean
          lake env lean tests/Issue68MapReads.lean
          lake env lean tests/Issue69Bytes32Map.lean
          lake env lean tests/Issue69NestedCounter.lean
          lake env lean tests/Issue69CompositeMap.lean
          lake env lean tests/Issue70PersistentHash.lean
          lake env lean tests/Issue70HashPreimages.lean
          lake env lean tests/Issue70Jubjub.lean
          lake env lean tests/Issue70DerivedCrypto.lean
          lake env lean tests/NativeInverse.lean
          lake env lean tests/NativeByteConversions.lean
          lake env lean tests/NativeByteIndexing.lean
          lake env lean tests/NativeByteReverse.lean
          lake env lean tests/CurveWitness.lean
          lake env lean tests/CurveHelpers.lean
          lake env lean tests/HashWitness.lean
          lake env lean tests/NestedEscrow.lean
          lake env lean tests/NativeCounter.lean
          lake env lean tests/NativeList.lean
          lake env lean tests/NativeReturns.lean
          lake env lean tests/NativeOpaqueReturns.lean
          lake env lean tests/Issue43ConditionalWrites.lean
          lake env lean tests/Issue43EmptyActivity.lean
          lake env lean tests/Issue43MapMembership.lean
          lake env lean tests/Issue43GuardedPartialWrites.lean
          lake env lean tests/Issue43GuardedReads.lean
          lake env lean tests/Issue43EffectBlocks.lean
          lake env lean examples/openzeppelin/PublicSupply.lean
          lake env lean examples/openzeppelin/ConfidentialToken.lean
      - name: Check readable private state source and disclosure
        run: bash tests/private-authoring-cli.sh
